[project]
name = "recomendador-practicas"
version = "1.0.0"
description = "Prototipo de sistema de recomendación de escenarios de práctica profesional (CECAR)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
